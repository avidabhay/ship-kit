name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      -
        name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      -
        name: Install locked dependencies
        run: npm ci

      -
        name: Check formatting
        run: npm run format:check

      -
        name: Lint
        run: npm run lint

      -
        name: Check types
        run: npm run typecheck

      -
        name: Test with coverage gate
        run: npm run coverage
      -
        name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install "semgrep==1.176.1"
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      -
        name: Scan source code
        run: npm run scan:code
      -
        name: Install Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            gitleaks.tar.gz | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      -
        name: Scan current files for secrets
        run: npm run scan:secrets:files

      -
        name: Scan Git history for secrets
        run: npm run scan:secrets:history
